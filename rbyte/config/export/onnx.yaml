# @package _global_

---
defaults:
  - /paths: yaak/default
  - /model: smolvla
  - /datamodule: yaak/predict
  - _self_

device: cuda
# device: cpu
dtype: torch.float16
# dtype: torch.bfloat16

job_name: onnx-smolvla-560000:v3-n10
export_embedding_separately: true

artifacts_dir: ${hydra:run.dir}

reye_torch: /nasa/team-space/artifacts/predictions/lerobot/export_action_only/torch
reye_onnx: /nasa/team-space/artifacts/predictions/lerobot/export_action_only/onnx




normalization_kwargs:
  _recursive_: true
  _convert_: all
  f: ${hydra:run.dir}/normalization/normalization.pt


embedding_full_kwargs:
  _recursive_: true
  _convert_: all
  f: ${hydra:run.dir}/embedding/embedding_full.onnx
  artifacts_dir: ${hydra:run.dir}/embedding
  resize_in_episode_construction: True
  output_names:
    - prefix_embs
    - prefix_pad_masks
    - prefix_att_masks


embedding_inc_kwargs:
  _recursive_: true
  _convert_: all
  f: ${hydra:run.dir}/embedding/embedding_incremental.onnx
  artifacts_dir: ${hydra:run.dir}/embedding
  context_length: 6
  num_tokens:
    - 64 # images
    - 48 # language
    - 1  # intent
    - 1 # state
  output_names:
    - prefix_embs
    - prefix_pad_masks
    - prefix_att_masks


action_kwargs:
  _recursive_: true
  _convert_: all
  f: ${hydra:run.dir}/action/action3.onnx
  artifacts_dir: ${hydra:run.dir}/action
  num_steps: 3
  action_dim: 3
  output_names:
    - actions_gbs


model_full_kwargs:
  _recursive_: true
  _convert_: all
  f: ${hydra:run.dir}/model_full.onnx
  artifacts_dir: ${hydra:run.dir}
  # resize_in_episode_construction: True
  num_steps: 3
  action_dim: 3
  output_names:
    - prefix_embs
    - prefix_pad_masks
    - prefix_att_masks
    - actions_gbs

model_inc_kwargs:
  _recursive_: true
  _convert_: all
  f: ${hydra:run.dir}/model_incremental.onnx
  artifacts_dir: ${hydra:run.dir}
  context_length: 6
  num_tokens:
    - 64 # images
    - 48 # language
    - 1  # intent
    - 1 # state
  num_steps: 3
  action_dim: 3
  output_names:
    - prefix_embs
    - prefix_pad_masks
    - prefix_att_masks
    - actions_gbs

dynamo_kwargs:
  _recursive_: true
  _convert_: all
  strict: true


onnx_kwargs:
  _recursive_: true
  _convert_: all
  dynamo: true
  external_data: false
  optimize: true
  verify: true
  report: true
  dump_exported_program: true
  opset_version: 19
  do_constant_folding: true

